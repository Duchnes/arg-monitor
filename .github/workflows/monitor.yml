name: ARG Monitor v3

on:
  schedule:
    - cron: '*/10 * * * *'   # co 10 minut
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check.py

      - name: Commit archive & state
        run: |
          git config user.name "ARG Monitor"
          git config user.email "arg-monitor@users.noreply.github.com"
          git add state.json archive/ || true
          if git diff --staged --quiet; then
            echo "Brak zmian do commitowania"
          else
            git commit -m "chore: ARG update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
