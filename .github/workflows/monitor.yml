name: ARG Monitor (rozbudowany)

on:
  schedule:
    # Co 10 minut (GitHub free pozwala na ~14 uruchomień/godz.)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # ręczne odpalenie z UI GitHuba

permissions:
  contents: write   # żeby commitować archiwum i state

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check.py

      - name: Commit archive & state (jeśli coś się zmieniło)
        run: |
          git config user.name "ARG Monitor"
          git config user.email "arg-monitor@users.noreply.github.com"
          git add state.json archive/ || true
          if git diff --staged --quiet; then
            echo "Brak zmian do commitowania"
          else
            git commit -m "chore: aktualizacja archiwum ARG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
